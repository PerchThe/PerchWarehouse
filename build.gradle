plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "3.1.0"
}

group = 'dev.ev1dent'
version = '1.0-Development'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "essentialsx-releases"
        url = "https://repo.essentialsx.net/releases/"
    }
}

dependencies {
    // Paper dropped -R0.1-SNAPSHOT in 26.1. Versions are now <mc>.build.<n>-<status>.
    // Keep ".build." in the pattern, "26.2.+" could jump to a different (breaking) patch version.
    compileOnly("io.papermc.paper:paper-api:26.2.build.+")
    compileOnly("net.essentialsx:EssentialsX:2.21.2") {
        // Essentials depends on spigot-api, which clashes with paper-api (Paper already includes it)
        exclude group: 'org.spigotmc', module: 'spigot-api'
    }
}

tasks {
    runServer {
        // Configure the Minecraft version for our task.
        // This is the only required configuration besides applying the plugin.
        // Your plugin's jar (or shadowJar if present) will be used automatically.
        minecraftVersion("26.2")
    }
    tasks.register('runTestServer', xyz.jpenilla.runpaper.task.RunServer) {
        minecraftVersion("26.1.2")
        runDirectory = file("run-26.1")
        pluginJars.from(tasks.jar.archiveFile)
    }
}

// Minecraft 26.x requires Java 25
def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
